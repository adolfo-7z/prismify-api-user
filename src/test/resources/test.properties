server.port=0
spring.application.name=transparencia-api-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
jwt.secret.key=test-secret
jwt.expiration.time=3600000
spring.application.default-username=admin
spring.application.default-email=admin@example.com
spring.application.default-password=admin123
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=none
spring.mail.password=none
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
logging.level.root=ERROR
spring.flyway.enabled=false