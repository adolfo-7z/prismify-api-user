server.port=0
spring.application.name=user-api-test
spring.application.version=${spring.application.version}
server.servlet.context-path=/v1/api
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

spring.mail.host=none
spring.mail.port=0
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

user.api.url=http://localhost/mock-user-api
result.api.url=http://localhost/mock-result-api
survey.api.url=http://localhost/mock-survey-api
general.api.url=http://localhost/mock-general-api

jwt.secret.key=test-secret
jwt.expiration.time=3600

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
