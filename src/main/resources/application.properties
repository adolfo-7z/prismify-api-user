server.port=${SERVER_PORT}
spring.application.name=etransparencia-api-user
spring.application.version=3.3.0-SNAPSHOT
spring.datasource.url=${DB_URI}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
server.servlet.context-path=/v1/api
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
jwt.secret.key=${SECRET_KEY}
jwt.expiration.time=${EXP_TIME}
spring.application.default-username=${ADMIN_USERNAME}
spring.application.default-email=${ADMIN_EMAIL}
spring.application.default-password=${ADMIN_PASSWORD}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
origin.url=${ORIGIN_URL}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.config.import=optional:file:.env[.properties]
